name: Patch Sweep

# Exhaustive version of the patch dry-run. The PR gate in ci-checks.yml samples
# a handful of profiles because a full sweep is too slow to block a merge on.
# That sampling is why the known-unbuildable list drifted: nobody was checking
# the other 150 profiles. This runs all of them weekly and opens an issue when
# the answer changes.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: patch-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep every profile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JOBS: 8
      OUT: sweep.tsv
    steps:
      - uses: actions/checkout@v6

      - name: Run the sweep
        id: sweep
        run: |
          set +e
          ./scripts/sweep-patches.sh > sweep.log 2>&1
          rc=$?
          set -e
          cat sweep.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

          {
            echo "## Patch sweep"
            echo ""
            echo '```'
            tail -n 40 sweep.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A non-zero rc means a profile fails and is not marked blocked, or a
          # blocked profile now applies. Both are worth an issue; neither should
          # fail the workflow, because the issue is the report.
          exit 0

      - name: Upload the result table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: patch-sweep
          path: |
            sweep.tsv
            sweep.log
          archive: false
          retention-days: 30

      - name: Open or update the issue
        if: steps.sweep.outputs.rc != '0'
        run: |
          set -euo pipefail
          fail=$(awk -F'\t' '$1 == "FAIL"' sweep.tsv | wc -l | tr -d ' ')
          stale=$(awk -F'\t' '$1 == "STALE"' sweep.tsv | wc -l | tr -d ' ')
          blocked=$(awk -F'\t' '$1 == "BLOCKED"' sweep.tsv | wc -l | tr -d ' ')
          pass=$(awk -F'\t' '$1 == "PASS"' sweep.tsv | wc -l | tr -d ' ')

          title="Patch sweep: $fail unblocked failure(s), $stale stale block(s)"

          {
            echo "Weekly \`scripts/sweep-patches.sh\` result for \`${{ github.sha }}\`."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pass | $pass |"
            echo "| Blocked (expected) | $blocked |"
            echo "| **Fail, not marked blocked** | **$fail** |"
            echo "| **Marked blocked but now applies** | **$stale** |"
            echo ""
            if [ "$fail" -gt 0 ]; then
              echo "### Failing profiles"
              echo ""
              echo "These fail the patch sequence and carry no \`blocked\` field, so a build"
              echo "would abort on the leftover \`.rej\`. Either fix the patch or add the field."
              echo ""
              echo "| Profile | Failing files |"
              echo "|---|---|"
              awk -F'\t' '$1 == "FAIL" { printf "| `%s` | %s |\n", $2, $3 }' sweep.tsv
              echo ""
            fi
            if [ "$stale" -gt 0 ]; then
              echo "### Stale blocks"
              echo ""
              echo "These are marked \`blocked\` but now apply cleanly. Remove the field."
              echo ""
              awk -F'\t' '$1 == "STALE" { printf "- `%s`\n", $2 }' sweep.tsv
              echo ""
            fi
            echo "*Generated by the [patch sweep](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > body.md

          existing=$(gh issue list --state open --label "patch-sweep" \
            --json number --jq '.[0].number // empty')

          gh label create "patch-sweep" --color "d93f0b" \
            --description "Weekly patch dry-run found drift" --force || true

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
            echo "Commented on issue #$existing"
          else
            gh issue create --title "$title" --body-file body.md --label "patch-sweep"
          fi

      - name: Close the issue when clean
        if: steps.sweep.outputs.rc == '0'
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --label "patch-sweep" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Every profile passes the patch sequence again."
            echo "Closed issue #$existing"
          else
            echo "Nothing to close"
          fi
