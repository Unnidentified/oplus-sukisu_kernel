name: CI Checks

# Static gates that run in minutes instead of after a 40-minute kernel build.
# Nothing here compiles a kernel; it verifies that the inputs a build consumes
# are still valid.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate build profiles
        run: python3 scripts/validate-configs.py

      - name: Validate workflow and action YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          failed = False
          for path in sorted(glob.glob('.github/workflows/*.yml') +
                             glob.glob('.github/actions/*/action.yml') +
                             glob.glob('.github/actions/*/*/action.yml')):
              try:
                  yaml.safe_load(open(path))
              except Exception as exc:
                  print(f"FAIL {path}: {exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Install pinned shellcheck
        run: |
          # actionlint shells out to whatever shellcheck is on PATH, so leaving
          # this to the runner image makes the gate non-deterministic: the
          # preinstalled version reports codes (SC2236, SC2002) that 0.11.0 does
          # not, and the image changes without notice. Pin it.
          version=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-v${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | head -2

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # Structural problems (invalid action metadata, duplicate choice
          # options, bad expressions) are fatal. The shellcheck codes below are
          # a pre-existing backlog in the 3000-line build action — mostly
          # unquoted variables — suppressed so this gate reports new problems
          # instead of re-reporting the old ones. Burn the backlog down
          # separately, then drop the matching -ignore line.
          #
          # SC2236 and SC2002 are listed defensively: the pinned shellcheck does
          # not emit them, but older versions do, and an ignore that matches
          # nothing is harmless.
          ./actionlint -color -shellcheck=/usr/local/bin/shellcheck \
            -ignore 'SC2086:.*' \
            -ignore 'SC2034:.*' \
            -ignore 'SC2129:.*' \
            -ignore 'SC2016:.*' \
            -ignore 'SC2001:.*' \
            -ignore 'SC2059:.*' \
            -ignore 'SC2193:.*' \
            -ignore 'SC2181:.*' \
            -ignore 'SC2163:.*' \
            -ignore 'SC2236:.*' \
            -ignore 'SC2002:.*'

      - name: shellcheck scripts
        run: shellcheck -s bash scripts/*.sh

      - name: python syntax
        run: python3 -m py_compile scripts/*.py

      - name: build-info smoke test
        run: |
          # The writer derives the kernel source commit from the manifest, which
          # is the only authoritative record of it. Assert it resolves for every
          # manifest we ship, so a manifest rename cannot silently blank out
          # build provenance.
          set -euo pipefail
          printf 'payload' > /tmp/fake.zip
          count=0
          for manifest in manifests/*.xml manifests/*/*.xml; do
            python3 scripts/build-info.py \
              --out /tmp/build-info.json \
              --manifest "$manifest" \
              --model OP-TEST --os-version A16 \
              --android-version android16 --kernel-version 6.12 \
              --zip /tmp/fake.zip > /dev/null
            python3 -c 'import json,sys; k=json.load(open("/tmp/build-info.json"))["kernel"]; sys.exit(0 if k["source_url"] and k["source_ref"] else 1)' \
              || { echo "::error::$manifest: kernel source did not resolve"; exit 1; }
            count=$((count + 1))
          done
          echo "build-info resolved a kernel source for $count manifest(s)"

  patch-check:
    name: Patch dry-run (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: select
    if: needs.select.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Apply patch sequence to the pinned base
        run: |
          set +e
          ./scripts/check-patches.sh "${{ matrix.config }}"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          # Blocking entries are refs we control (a pinned susfs_hash, or a KMI
          # key whose workflow default is a pinned SHA) — a failure there is a
          # regression in this repo. The rest track a moving upstream branch
          # tip, so a failure is drift we cannot fix here: surface it as a
          # warning annotation instead of failing the PR.
          if [ "${{ matrix.blocking }}" = "true" ]; then
            exit "$rc"
          fi
          echo "::warning title=Upstream SUSFS drift::${{ matrix.label }} no longer applies against the current default SUSFS ref. This profile tracks a moving branch tip, so it is upstream drift rather than a regression in this repo."

  select:
    name: Select patch-check targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Pick profiles that exercise repo-local patches
        id: pick
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json

          # Mirrors the androidXX_susfs_branch_or_commit input defaults in
          # build-kernel-release.yml. A key with a pinned default is something
          # we control, so its canary blocks. A key whose default is a moving
          # branch tip is upstream drift — worth reporting, not worth blocking
          # an unrelated PR over.
          PINNED_DEFAULT_KEYS = {"android16-6.12"}

          entries = []
          for path in sorted(glob.glob("configs/*/*.json")):
              if path.endswith("schema.json"):
                  continue
              cfg = json.load(open(path))
              # Profiles whose build applies a patch we maintain in this repo.
              if cfg.get("bore") or cfg.get("adios") or cfg.get("susfs_hash"):
                  entries.append({"label": cfg["model"], "config": path, "blocking": True})

          # One canary per kernel source that relies on the default SUSFS ref,
          # so a moved default branch is caught before it reaches a build.
          seen = set()
          for path in sorted(glob.glob("configs/*/*.json")):
              if path.endswith("schema.json"):
                  continue
              cfg = json.load(open(path))
              if not cfg.get("susfs") or cfg.get("susfs_hash"):
                  continue
              key = f"{cfg['android_version']}-{cfg['kernel_version']}"
              if key in seen:
                  continue
              seen.add(key)
              entries.append({
                  "label": f"{cfg['model']}-default",
                  "config": path,
                  "blocking": key in PINNED_DEFAULT_KEYS,
              })

          print("matrix=" + json.dumps({"include": entries}))
          PY

  checkpatch:
    name: checkpatch (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Fetch checkpatch.pl from the pinned GKI base
        run: |
          set -euo pipefail
          commit=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for project in ET.parse("manifests/a16/oneplus_15_6.12.69_gki_w.xml").getroot().findall("project"):
              if project.get("name") == "kernel/common":
                  print(project.get("revision"))
                  break
          PY
          )
          git init -q kc
          git -C kc remote add origin https://android.googlesource.com/kernel/common
          git -C kc fetch -q --depth 1 --filter=blob:none origin "$commit"
          git -C kc checkout -q FETCH_HEAD -- scripts/checkpatch.pl scripts/spelling.txt

      - name: Run checkpatch on hand-ported patches
        run: |
          set -uo pipefail
          for patch in .github/actions/build-kernel/patches/*.patch; do
            echo "### $(basename "$patch")"
            perl kc/scripts/checkpatch.pl --no-tree --strict --terse \
              --ignore FILE_PATH_CHANGES,SPDX_LICENSE_TAG < "$patch" || true
            echo
          done
          # Advisory only: the hand-ported patches are out-of-tree by design and
          # will never be style-clean. Surface the findings, do not gate on them.
          exit 0
